name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version to build (for example, 1.0.7)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set plugin version
        if: github.event_name == 'workflow_dispatch'
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$PLUGIN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid plugin version: $PLUGIN_VERSION"
            exit 1
          fi
          node version-bump.mjs

      - name: Build plugin
        run: npm run build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: synonym-plugin
          if-no-files-found: error
          path: |
            main.js
            manifest.json
            styles.css
            assets/

  release:
    name: Create GitHub release
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: synonym-plugin
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          RELEASE_TAG="v$PLUGIN_VERSION"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Replacing existing release $RELEASE_TAG"
            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --yes \
              --cleanup-tag
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Replacing existing tag $RELEASE_TAG"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"
          fi

          gh release create "v$PLUGIN_VERSION" \
            "release/main.js" \
            "release/manifest.json" \
            "release/styles.css" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Synonym v$PLUGIN_VERSION" \
            --generate-notes
