name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version to build (for example, 1.0.7)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set plugin version
        if: github.event_name == 'workflow_dispatch'
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$PLUGIN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid plugin version: $PLUGIN_VERSION"
            exit 1
          fi
          node version-bump.mjs

      - name: Build plugin
        run: npm run build

      - name: Package plugin
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$PLUGIN_VERSION" ]; then
            PACKAGE_NAME="synonym-$PLUGIN_VERSION.zip"
          else
            PACKAGE_NAME="synonym-build.zip"
          fi
          zip -r "$PACKAGE_NAME" main.js manifest.json styles.css assets

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: synonym-plugin
          if-no-files-found: error
          path: |
            main.js
            manifest.json
            styles.css
            assets/
            *.zip

  release:
    name: Create GitHub release
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: synonym-plugin
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release create "v$PLUGIN_VERSION" \
            "release/main.js" \
            "release/manifest.json" \
            "release/styles.css" \
            "release/synonym-$PLUGIN_VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Synonym v$PLUGIN_VERSION" \
            --generate-notes
