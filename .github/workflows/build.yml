name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version to build (for example, 1.0.7)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set plugin version
        if: github.event_name == 'workflow_dispatch'
        env:
          PLUGIN_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$PLUGIN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid plugin version: $PLUGIN_VERSION"
            exit 1
          fi
          node version-bump.mjs

      - name: Build plugin
        run: npm run build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: synonym-plugin
          if-no-files-found: error
          path: |
            main.js
            manifest.json
            styles.css
            assets/
